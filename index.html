<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>ชงหวานหวาน</title>
  <meta name="description" content="เกมรถเข็นชงน้ำไทย ชงตามออเดอร์ คนให้เข้ากัน แล้วเสิร์ฟใส่แก้วหรือถุง">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Charm:wght@400;700&family=Mitr:wght@300;400;500&display=swap">
</head>
<body>
  <div id="stage">
    <canvas id="gl" aria-label="เครื่องดื่มสามมิติบนเคาน์เตอร์หินขัด"></canvas>
    <canvas id="garland" aria-hidden="true"></canvas>
    <div id="top">
      <div id="brand"><small>ชงหวานหวาน · รถเข็นหน้าโรงเรียน</small><b>วันที่ <span id="day">1</span> · ลูกค้า <span id="order-no">0</span>/<span id="day-total">8</span></b></div>
      <div id="money"><span id="money-n">0</span> บาท</div>
    </div>
    <aside id="orders" aria-label="ออเดอร์ที่รออยู่"></aside>
    <div id="tag" hidden></div>
    <section id="hud" aria-live="polite">
      <div id="stir" hidden>
        <svg id="ring" viewBox="0 0 56 56" role="img" aria-label="ความเข้ากันของเครื่องดื่ม"><circle cx="28" cy="28" r="22" fill="none" stroke="#3a2212" stroke-width="6"/><circle id="ring-fg" cx="28" cy="28" r="22" fill="none" stroke="#f2c14e" stroke-width="6" stroke-linecap="round" stroke-dasharray="138.2" stroke-dashoffset="138.2" transform="rotate(-90 28 28)"/><text id="stir-pct" x="28" y="32" text-anchor="middle">0%</text></svg>
        <div id="stir-stats"><div><b id="stir-speed">0.0</b>รอบ/วินาที</div><div><b id="stir-time">0.0</b>วินาที</div></div>
      </div>
      <div id="contents"></div>
      <div id="hint"></div>
    </section>
    <div id="actions">
      <button type="button" class="ghost" id="reset" hidden>เทใหม่</button>
    </div>
    <button type="button" class="pill under-glass" id="spoon-done" hidden>คนเสร็จ วางช้อน</button>
    <button type="button" class="pill under-glass" id="serve" hidden>เสร็จ แขวนรอส่ง</button>
    <section id="result-card" hidden></section>
    <section id="day-card" hidden aria-live="polite"></section>
    <aside id="dev-panel" hidden aria-label="Dev mode">
      <button type="button" class="ghost" id="dev-toggle" aria-expanded="false" aria-controls="dev-tools">Dev</button>
      <div id="dev-tools" hidden>
        <button type="button" id="dev-end-day">ปิดร้านตอนนี้ (สรุปวัน + ร้านค้า)</button>
        <button type="button" id="dev-money">เพิ่มเงิน 500 บาท</button>
        <button type="button" id="dev-rush">ลูกค้าทุกคนเหลือเวลา 5 วินาที</button>
        <button type="button" id="dev-reset">ล้างข้อมูลเกม เริ่มวันที่ 1</button>
      </div>
    </aside>
    <section id="unsupported" role="alert">
      <img src="/favicon.svg" alt="" width="64" height="64">
      <h1>ชงหวานหวาน</h1>
      <p>ตอนนี้เกมยังไม่รองรับมือถือและแท็บเล็ต</p>
      <p class="sub">เปิดลิงก์นี้บนคอมพิวเตอร์ที่ใช้เมาส์ แล้วขยายหน้าต่างให้กว้างพอ</p>
    </section>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
