<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>ชงหวานหวาน</title>
  <meta name="description" content="เกมรถเข็นชงน้ำไทย ชงตามออเดอร์ คนให้เข้ากัน แล้วเสิร์ฟใส่แก้วหรือถุง">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Charm:wght@400;700&family=Mitr:wght@300;400;500&display=swap">
</head>
<body>
  <div id="stage">
    <canvas id="gl" aria-label="เครื่องดื่มสามมิติบนเคาน์เตอร์หินขัด"></canvas>
    <canvas id="garland" aria-hidden="true"></canvas>
    <div id="top">
      <div id="brand"><small>รถเข็นหน้าโรงเรียน</small><b>ออเดอร์ที่ <span id="order-no">1</span></b></div>
      <div id="money"><span id="money-n">0</span> บาท</div>
    </div>
    <aside id="ticket">
      <div id="photo"><div class="in"><img id="target" alt="ภาพเครื่องดื่มที่ลูกค้าสั่ง"><div id="seal">สั่ง</div></div></div>
      <div id="slip">
        <div id="order-name"></div>
        <div id="who"><div id="avatar" aria-hidden="true"></div><div id="quote"></div></div>
        <div id="recipe"></div>
      </div>
    </aside>
    <section id="panel-wrap" aria-label="วัตถุดิบ">
      <div id="crest">
        <svg viewBox="0 0 320 50" preserveAspectRatio="none" aria-hidden="true"><path d="M10 50 Q40 44 62 28 Q80 26 92 14 Q112 16 124 7 Q142 9 160 0 Q178 9 196 7 Q208 16 228 14 Q240 26 258 28 Q280 44 310 50Z" fill="#8a4c1e" stroke="#d9a457" stroke-width="2"/></svg>
        <span>ชงหวานหวาน</span>
      </div>
      <div id="panel"></div>
      <div class="foot" id="foot"></div>
    </section>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
